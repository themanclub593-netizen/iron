  --void:#050203;--p1:#0f0709;--p2:#180b10;--p3:#241018;--ln:#26121a;--ln2:#3d1c28;
  --ink:#fff0f3;--mut:#cfa9b5;--fnt:#96707d;
  --c1:#ff5c8a;--c2:#ff2d55;--c3:#c0002f;
  --grad:linear-gradient(118deg,#ff6b92 0%,#ff2d55 46%,#c0002f 100%);
  --acc:#ff2d55;--acc2:#ff8a2a;--ok:#4fe3a8;--warn:#ffb547;--bad:#ff6a3d;--gold:#ffd15c;
  --card:var(--p1);--card2:var(--p2);--line:var(--ln);--line2:var(--ln2);--bg2:var(--p1);
  --h:'Chakra Petch','IBM Plex Sans Thai',system-ui,sans-serif;
  --b:'IBM Plex Sans Thai','Chakra Petch',-apple-system,system-ui,sans-serif;
  --m:'Chakra Petch','IBM Plex Sans Thai',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--void)}
body{background:var(--void);color:var(--ink);font:400 15px/1.5 var(--b);min-height:100vh;min-height:100dvh;
  padding-bottom:calc(86px + env(safe-area-inset-bottom));overflow-x:hidden;-webkit-font-smoothing:antialiased}
input,select,textarea,button{font-family:var(--b);color:var(--ink)}
button{cursor:pointer}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield}
::selection{background:var(--c2);color:#fff}
:focus-visible{outline:2px solid var(--c1);outline-offset:2px}
h1,h2,h3{font-family:var(--h);font-weight:700}
b{font-weight:600}

/* faint swoosh arcs from the logo, behind everything */
.bgfx{position:fixed;inset:0 0 auto 0;height:300px;pointer-events:none;z-index:0;opacity:.5}
.bgfx svg{width:100%;height:100%}
.bgfx path{fill:none;stroke:#ff2d55;stroke-width:1.2;opacity:.22}
.bgfx path+path{stroke:#ff5c8a;opacity:.14}
.top,.wrap,.nav{position:relative;z-index:1}

/* ---------- header ---------- */
.top{position:sticky;top:0;z-index:40;padding:max(10px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) 10px max(14px,env(safe-area-inset-left));
  background:linear-gradient(180deg,#050203 72%,rgba(5,2,3,.86));backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--ln)}
.trow{display:flex;align-items:center;gap:8px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.logo{width:36px;height:36px;flex:0 0 auto;border-radius:8px;background:#000 var(--logo) center/cover no-repeat;
  box-shadow:0 0 16px -3px rgba(255,45,85,.75)}
.brand b{font:700 21px/1 var(--h);letter-spacing:.07em}
.streak{display:flex;align-items:center;gap:4px;height:34px;padding:0 12px;border-radius:999px;background:rgba(255,181,71,.08);
  border:1px solid rgba(255,181,71,.28);font:600 15px/1 var(--h);color:#ffc977;font-variant-numeric:tabular-nums}
.streak.hot{box-shadow:0 0 18px -6px rgba(255,181,71,.8)}
.dpick{height:34px;max-width:132px;background:var(--p2);border:1px solid var(--ln2);border-radius:11px;padding:0 9px;font:500 13px var(--b);color:var(--mut);color-scheme:dark}
.strip{display:flex;gap:6px;margin-top:10px}
.dch{flex:1;min-width:0;text-align:center;padding:7px 0 6px;border-radius:14px;border:1px solid var(--ln);background:var(--p1);
  position:relative;font:inherit;color:inherit;transition:transform .22s cubic-bezier(.2,.8,.3,1),border-color .2s,background .2s}
.dch .w{font:500 12px/1.2 var(--b);color:var(--fnt)}
.dch .n{font:700 18px/1.25 var(--h);margin:1px 0 2px;font-variant-numeric:tabular-nums}
.dch .e{font-size:13px;line-height:1}
.dch:active{transform:scale(.94)}
.dch.sel{border-color:var(--dc);background:color-mix(in srgb,var(--dc) 15%,#000);transform:translateY(-2px)}
.dch.sel .n{color:var(--dc)}
.dch.sel .w{color:var(--mut)}
.dch.tdy::after{content:'';position:absolute;left:32%;right:32%;bottom:-1px;height:2px;border-radius:2px;background:var(--c1);box-shadow:0 0 8px var(--c1)}
.ok{position:absolute;top:-5px;right:-4px;width:16px;height:16px;border-radius:50%;background:var(--c3);border:1.5px solid #fff;display:grid;place-items:center}
.ok svg{width:9px;height:9px;fill:none;stroke:#fff;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}

.wrap{max-width:640px;margin:0 auto;padding:14px max(14px,env(safe-area-inset-right)) 0 max(14px,env(safe-area-inset-left))}
.vin{animation:vin .3s cubic-bezier(.2,.8,.3,1) both}
@keyframes vin{from{opacity:0;transform:translateY(6px)}}

/* ---------- hero ---------- */
.hero{position:relative;overflow:hidden;border-radius:24px;padding:18px 18px 0;margin-bottom:12px;
  background:radial-gradient(130% 100% at 100% 0%,color-mix(in srgb,var(--dc) 20%,transparent),transparent 58%),var(--p1);
  border:1px solid color-mix(in srgb,var(--dc) 34%,var(--ln))}
.hero .arc{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.hero .arc path{fill:none;stroke:var(--dc);stroke-width:1.4;opacity:.3}
.hero .arc path+path{opacity:.15}
.hero .in{position:relative;z-index:1;padding-right:86px}
.hero.mini,.hero.rest{padding-bottom:16px}
.hero.rest .in{padding-right:0}
.hero.mini .in{padding-right:0}
.kick{font:500 13.5px/1.35 var(--b);color:var(--mut)}
.hero h2{font:700 35px/1.05 var(--h);margin:4px 0 5px;letter-spacing:.01em}
.hero.mini h2{font-size:30px;margin-top:0}
.hero .sub{font-size:14px;color:var(--mut)}
.hstats{display:flex;gap:24px;margin-top:14px;padding-bottom:12px}
.hero.mini .hstats{padding-bottom:0}
.hstats b{display:block;font:700 23px/1.1 var(--h);font-variant-numeric:tabular-nums}
.hstats span{font-size:12.5px;color:var(--mut)}
.ring{position:absolute;right:16px;top:18px;width:68px;height:68px;z-index:2}
.ring svg{transform:rotate(-90deg);display:block}
.ring .pct{position:absolute;inset:0;display:grid;place-items:center;font:700 16px var(--h);color:var(--dc)}
.swapb{margin-top:11px;height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--ln2);background:rgba(255,255,255,.03);color:var(--mut);font:500 13px var(--b)}
.swapb:active{transform:scale(.96)}
.ecg{display:block;width:calc(100% + 36px);margin:2px -18px 0;height:34px;overflow:visible}
.ecg path{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ecg .tr{stroke:rgba(255,255,255,.13)}
.ecg .pg{stroke:var(--dc);stroke-dasharray:0 100;transition:stroke-dasharray .8s cubic-bezier(.2,.8,.3,1);filter:drop-shadow(0 0 4px var(--dc))}
.ecg .bt{stroke:#fff;stroke-width:2.6;stroke-dasharray:7 100;stroke-dashoffset:7;opacity:0;filter:drop-shadow(0 0 6px #fff)}
.ecg.beat .bt{animation:beat .95s cubic-bezier(.3,.6,.4,1)}
@keyframes beat{0%{stroke-dashoffset:7;opacity:1}85%{opacity:1}100%{stroke-dashoffset:-100;opacity:0}}

/* banners */
.cb{display:flex;gap:12px;align-items:flex-start;padding:14px 15px;border-radius:18px;margin-bottom:12px;
  background:rgba(255,181,71,.07);border:1px solid rgba(255,181,71,.3);font-size:14px;line-height:1.6;color:#f6dcb2}
.cb>span{font-size:20px;line-height:1.3}
.cb b{color:#ffd28a}
.upb{display:flex;gap:12px;align-items:center;padding:14px 15px;border-radius:18px;margin-bottom:12px;
  background:linear-gradient(118deg,rgba(255,92,138,.11),rgba(192,0,47,.09));border:1px solid rgba(255,45,85,.45)}
.upb p{flex:1;font-size:14px;line-height:1.5;color:var(--mut)}
.upb p b{display:block;color:var(--ink);font-size:15px}
.upb button{flex:0 0 auto;height:40px;padding:0 14px;border:none;border-radius:12px;background:var(--grad);color:#fff;font:600 14px var(--h)}

/* ---------- exercise cards ---------- */
.card{position:relative;background:var(--p1);border:1px solid var(--ln);border-radius:22px;margin-bottom:12px;overflow:hidden;
  transition:border-color .3s,box-shadow .3s}
.card::before{content:'';position:absolute;left:0;top:18px;width:3px;height:26px;border-radius:0 3px 3px 0;background:var(--ec)}
.card.hit{border-color:rgba(255,92,138,.55);box-shadow:0 14px 34px -18px rgba(255,45,85,.95)}
.card.pr{border-color:rgba(255,207,90,.6)}
.card.dn .sets,.card.dn .qw,.card.dn .shead{opacity:.5}
.ch{padding:16px 15px 10px 17px}
.ctop{display:flex;gap:10px;align-items:flex-start}
.exn{font:600 19px/1.25 var(--h)}
.tags{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.tg{font:500 12.5px/1 var(--b);padding:6px 9px;border-radius:8px;background:var(--p2);color:var(--mut)}
.tg.a{color:var(--ink);background:color-mix(in srgb,var(--ec) 17%,var(--p2))}
.tg.c{color:var(--c1);background:rgba(255,92,138,.09)}
.exnote{font-size:13.5px;color:var(--mut);margin-top:9px;line-height:1.55}
.acts{display:flex;gap:6px;flex:0 0 auto}
.ib{flex:0 0 auto;width:38px;height:38px;border-radius:12px;border:1px solid var(--ln2);background:var(--p2);font-size:16px;display:grid;place-items:center;transition:transform .15s}
.ib:active{transform:scale(.9)}
.ib.on{border-color:var(--c2);background:rgba(255,45,85,.13)}
.alts{display:flex;gap:6px;margin-top:11px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.alts::-webkit-scrollbar{display:none}
.alts button{flex:0 0 auto;height:34px;padding:0 12px;border-radius:11px;border:1px solid var(--ln2);background:transparent;color:var(--mut);font:500 13.5px var(--b);white-space:nowrap}

.tick.on svg{stroke:#fff}
.snote{margin:0 15px 8px 17px;display:none}.snote.show{display:block}

/* ---------- nav ---------- */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:60;display:flex;padding:6px max(6px,env(safe-area-inset-right)) calc(6px + env(safe-area-inset-bottom)) max(6px,env(safe-area-inset-left));

.toast{position:fixed;left:50%;bottom:calc(98px + env(safe-area-inset-bottom));transform:translate(-50%,14px);opacity:0;z-index:95;pointer-events:none;
  background:#fff;color:#1a0509;font:600 14px var(--b);padding:10px 18px;border-radius:999px;transition:.28s;white-space:nowrap;box-shadow:0 14px 34px -12px rgba(255,45,85,.7)}

.toast.w{background:var(--warn);color:#1d1100}

/* ---------- modal ---------- */
.mbg{position:fixed;inset:0;z-index:90;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.68);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}

.modal{width:100%;max-width:560px;max-height:88vh;overflow-y:auto;background:var(--p1);border:1px solid var(--ln2);border-bottom:none;border-radius:26px 26px 0 0;
  padding:20px 16px calc(18px + env(safe-area-inset-bottom));animation:sheet .32s cubic-bezier(.2,.8,.3,1) both}

.modal h3{font:700 22px/1.25 var(--h);margin-bottom:14px}

.ls .t{flex:1;min-width:0}

.ls .v{text-align:right;font:600 15px var(--h);white-space:nowrap}

.vrow{display:flex;align-items:center;gap:10px;margin-bottom:9px}

.csum .cnm{font-size:13px;color:var(--mut);margin-top:3px}
.calf{font-size:13.5px;color:var(--mut);margin-top:10px;text-align:center}

.ach{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}

@keyframes cfall{0%{transform:translateY(-12vh) rotate(0);opacity:1}100%{transform:translateY(108vh) rotate(720deg);opacity:.15}}

/* splash */
.splash{position:fixed;inset:0;z-index:200;background:#000;display:grid;place-items:center;transition:opacity .45s ease}
.splash.out{opacity:0;pointer-events:none}
.spl{display:flex;flex-direction:column;align-items:center;gap:16px}
.logo.xl{width:124px;height:124px;border-radius:22px;box-shadow:0 0 52px -8px rgba(255,45,85,.85);animation:lg .7s cubic-bezier(.2,.8,.3,1) both}
.secg{width:210px;height:34px;overflow:visible}
.secg path{fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:100;stroke-dashoffset:100;
  animation:draw .95s .15s ease-out forwards;filter:drop-shadow(0 0 5px rgba(255,92,138,.95))}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes lg{from{opacity:0;transform:scale(.9)}}

/* shared keyframes */
@keyframes pop{0%{transform:scale(.96)}50%{transform:scale(1.04)}100%{transform:scale(1)}}
@keyframes flash{0%{background:rgba(255,45,85,.18)}100%{background:transparent}}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.1)}100%{transform:scale(1)}}
@keyframes tick{0%{transform:scale(1)}30%{transform:scale(1.22)}60%{transform:scale(.95)}100%{transform:scale(1)}}

@media (max-width:370px){.hero h2{font-size:30px}.hstats{gap:16px}.sin{font-size:17px}.dch .n{font-size:16px}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .secg path{stroke-dashoffset:0}
}

/* ---------- readiness check-in (16 Nov) ---------- */
.hrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:11px}
.hrow .swapb{margin-top:0}
.lvb{display:inline-flex;align-items:center;gap:5px;height:32px;padding:0 12px;border-radius:999px;font:600 13px var(--b);font-style:normal;white-space:nowrap;flex:0 0 auto}
.lvb.g{background:rgba(56,227,181,.1);color:#a6f3dd;border:1px solid rgba(56,227,181,.38)}
.lvb.y{background:rgba(255,207,90,.1);color:#ffe3a1;border:1px solid rgba(255,207,90,.38)}
.lvb.o{background:rgba(255,138,61,.1);color:#ffc49f;border:1px solid rgba(255,138,61,.42)}
.lvb.r{background:rgba(255,79,109,.12);color:#ffb8c4;border:1px solid rgba(255,79,109,.48)}
.lvb.n{background:var(--p2);color:var(--mut);border:1px solid var(--ln2)}
.rd{padding:0;overflow:hidden}
.rdh{display:flex;align-items:center;gap:12px;width:100%;padding:15px 16px;background:none;border:none;text-align:left;color:var(--ink)}
.rdt{flex:1;min-width:0}
.rdt b{display:block;font:600 16px/1.3 var(--h)}
.rdt small{display:block;font-size:13px;color:var(--mut);margin-top:2px;line-height:1.45}
.rdq{padding:0 16px 16px;display:flex;flex-direction:column;gap:13px}
.rd.fold .rdq{display:none}
.rqt{font-size:13.5px;color:var(--mut);margin-bottom:6px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg button{min-height:44px;padding:6px 4px;border-radius:12px;border:1.5px solid var(--ln2);background:var(--p2);color:var(--mut);font:500 13.5px/1.25 var(--b);transition:border-color .18s,background .18s,color .18s,transform .12s}
.seg button:active{transform:scale(.96)}
.seg button.on{border-color:var(--c2);background:rgba(255,45,85,.14);color:var(--ink)}
.seg[data-k="ill"] button[data-i="1"].on{border-color:#ff8a3d;background:rgba(255,138,61,.13)}
.seg[data-k="ill"] button[data-i="2"].on{border-color:var(--bad);background:rgba(255,79,109,.13)}
.rdn{font-size:12.5px;color:var(--fnt);line-height:1.55}
.restc.sick{border-color:rgba(255,79,109,.35);background:radial-gradient(120% 90% at 50% 0%,rgba(255,79,109,.10),transparent 60%),var(--p1)}
.rcl{list-style:none;text-align:left;margin:14px auto 0;max-width:340px;display:flex;flex-direction:column;gap:8px}
.rcl li{font-size:14px;color:var(--mut);padding-left:20px;position:relative;line-height:1.5}
.rcl li::before{content:'';position:absolute;left:3px;top:8px;width:7px;height:7px;border-radius:50%;background:var(--c2)}
.cc.ill{box-shadow:inset 0 -3px 0 #ff8a3d}

/* completed exercise folds into one line; tap to reopen */
.fsum{display:none;font:500 13.5px/1.4 var(--b);color:var(--c1);margin-top:5px}
.card.fold .fsum{display:block}
.card.fold .tags,.card.fold .exnote,.card.fold .alts,.card.fold .sug,.card.fold .last,.card.fold .nbox,.card.fold .badge,
.card.fold .shead,.card.fold .sets,.card.fold .snote,.card.fold .qw,.card.fold .tbar,.card.fold .sctl,.card.fold .chartb,.card.fold .acts{display:none!important}
.card.fold .ch{padding-bottom:15px}
.card.dn .ctop{cursor:pointer}
.card.dn .ctop::after{content:'';flex:0 0 auto;width:9px;height:9px;margin:9px 4px 0 2px;border-right:2px solid var(--mut);border-bottom:2px solid var(--mut);transform:rotate(-135deg);transition:transform .2s}
.card.dn.fold .ctop::after{transform:rotate(45deg);margin-top:5px}
.card.fold{background:linear-gradient(90deg,rgba(255,45,85,.06),transparent 60%),var(--p1)}

/* =====================================================================
   v8 (26 Nov): crimson "training arc" theme from the new logo + AI coach
   ===================================================================== */
.bgfx{opacity:.55}
.bgfx .s{fill:#ff2d55;opacity:.18;stroke:none}
.bgfx path:not(.s){fill:none;stroke:#ff2d55;stroke-width:1.1;opacity:.16}
.bgfx path.f{stroke:#ff5c8a;opacity:.1}
.logo{border-radius:9px;box-shadow:0 0 16px -3px rgba(255,45,85,.8)}
.brand b{font:700 italic 22px/1 var(--h);letter-spacing:.09em;text-shadow:0 0 14px rgba(255,45,85,.45)}
.streak{background:rgba(255,45,85,.09);border:1px solid rgba(255,45,85,.36);color:#ff9db3}
.streak.hot{box-shadow:0 0 18px -5px rgba(255,45,85,.9)}
.dpick{background:var(--p2);border-color:var(--ln2)}

/* hero: slashes instead of arcs; poster with the illustration on the train view */
.hero .arc .s{fill:var(--dc);opacity:.2;stroke:none}
.hero .arc path:not(.s){fill:none;stroke:var(--dc);stroke-width:1.3;opacity:.2}
.hero.mini h2,.hero.poster h2{font-style:italic;letter-spacing:.01em}
.hero.poster{min-height:258px;padding:18px 18px 0;border-color:color-mix(in srgb,var(--dc) 42%,var(--ln));
  background:radial-gradient(90% 120% at 100% 30%,color-mix(in srgb,var(--dc) 26%,transparent),transparent 62%),#0b0507}
.hero .art{position:absolute;top:0;right:0;bottom:0;width:60%;pointer-events:none;
  background:var(--hero) 30% 0/cover no-repeat;
  -webkit-mask-image:linear-gradient(90deg,transparent 0%,rgba(0,0,0,.5) 24%,#000 54%);mask-image:linear-gradient(90deg,transparent 0%,rgba(0,0,0,.5) 24%,#000 54%)}
.hero.rest .art{opacity:.5}
.hero.poster .in{max-width:68%;padding-right:0}
.hero.poster.rest .in{max-width:68%}
.hero.poster h2{font:700 italic 42px/.98 var(--h);text-transform:uppercase;margin:7px 0 12px;
  text-shadow:0 2px 0 rgba(0,0,0,.45),0 0 26px color-mix(in srgb,var(--dc) 60%,transparent)}
.hero.poster h2::after{content:'';display:block;width:66px;height:5px;margin-top:10px;transform:skewX(-26deg);transform-origin:left;
  background:linear-gradient(90deg,var(--dc),color-mix(in srgb,var(--dc) 25%,transparent));box-shadow:0 0 14px color-mix(in srgb,var(--dc) 70%,transparent)}
.hero.poster .kick{color:#e9c6cf;text-shadow:0 1px 6px #000}
.hero.poster .sub{color:#e9c6cf;text-shadow:0 1px 8px #000}
.hero.poster .ring{top:auto;bottom:48px;right:14px;border-radius:50%;background:rgba(5,2,3,.72);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);box-shadow:0 0 0 1px rgba(255,255,255,.06)}
.hero.poster .ecg{position:relative;z-index:2}
.hstats b,.ring .pct,.fin b,.cyc b{font-style:italic}
.ecg{height:38px}
.ecg .tr{stroke:rgba(255,255,255,.12)}
.ecg .pg{stroke-width:2.6}
.swapb{background:rgba(5,2,3,.55)}

/* set done: a short burst ring when ticked (only on the row the user just ticked) */
.tick{position:relative}
.tick::after{content:'';position:absolute;inset:-3px;border-radius:50%;border:2px solid var(--c1);opacity:0;pointer-events:none}
.srow.flash .tick.on::after{animation:burst .55s ease-out}
@keyframes burst{0%{transform:scale(1);opacity:.95}100%{transform:scale(1.95);opacity:0}}
.big{font-weight:700;letter-spacing:.015em}

/* toast moves to the top so the coach owns the bottom */
.toast{top:calc(max(10px,env(safe-area-inset-top)) + 4px);bottom:auto;transform:translate(-50%,-14px);box-shadow:0 14px 34px -12px rgba(255,45,85,.7)}
.toast.show{transform:translate(-50%,0)}

/* splash */
.splash{background:radial-gradient(60% 45% at 50% 42%,rgba(255,45,85,.24),transparent 70%),#050203}
.spl{gap:8px}
.logo.xl{width:132px;height:132px;border-radius:30px;box-shadow:0 0 64px -6px rgba(255,45,85,.9)}
.srise{width:210px;height:58px;overflow:visible;margin-top:8px}
.srise path{fill:none;stroke:#ff2d55;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:100;stroke-dashoffset:100;
  animation:draw .8s .15s ease-out forwards;filter:drop-shadow(0 0 6px rgba(255,45,85,.95))}
.srise .hd{animation-delay:.9s;animation-duration:.22s}
.sword{font:700 italic 30px/1 var(--h);letter-spacing:.24em;padding-left:.24em;color:var(--ink);opacity:0;
  animation:wfade .5s .75s ease-out forwards;text-shadow:0 0 18px rgba(255,45,85,.75)}
@keyframes wfade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* nav: coach in the middle */
.nav .cbtn{flex:0 0 72px;gap:4px;padding-top:0;margin-top:-24px;color:var(--mut)}
.cbtn .cav{width:56px;height:56px;border-radius:50%;background:#000 var(--face) center/cover;border:2px solid var(--c2);display:block;
  box-shadow:0 0 0 4px #090405,0 0 24px -2px rgba(255,45,85,.8);transition:transform .2s}
.cbtn:active .cav{transform:scale(.92)}
.cbtn.live .cav{animation:cpulse 2.4s ease-in-out infinite}
@keyframes cpulse{0%,100%{box-shadow:0 0 0 4px #090405,0 0 24px -2px rgba(255,45,85,.8)}50%{box-shadow:0 0 0 4px #090405,0 0 34px 2px rgba(255,45,85,.95)}}
.cdot{position:absolute;top:-1px;right:9px;width:15px;height:15px;border-radius:50%;background:var(--gold);border:2.5px solid #090405;display:none}
.cdot.on{display:block;animation:pop .5s}

/* coach bubble above the nav */
.cbub{position:fixed;left:12px;right:12px;bottom:calc(94px + env(safe-area-inset-bottom));z-index:85;max-width:520px;margin:0 auto;
  display:flex;gap:10px;align-items:flex-start;padding:11px 10px 11px 12px;border-radius:18px;
  background:linear-gradient(120deg,rgba(255,45,85,.17),rgba(255,45,85,.04) 70%),#120709;border:1px solid rgba(255,45,85,.55);
  box-shadow:0 18px 40px -14px rgba(255,45,85,.55);transform:translateY(18px);opacity:0;pointer-events:none;
  transition:transform .34s cubic-bezier(.2,.9,.3,1.15),opacity .22s}
.cbub.show{transform:none;opacity:1;pointer-events:auto}
.cbub::after{content:'';position:absolute;bottom:-7px;left:50%;width:12px;height:12px;margin-left:-6px;background:#130709;
  border-right:1px solid rgba(255,45,85,.55);border-bottom:1px solid rgba(255,45,85,.55);transform:rotate(45deg)}
.cbub .cav{width:38px;height:38px;flex:0 0 auto;border-radius:50%;background:#000 var(--face) center/cover;border:1.5px solid var(--c2)}
.cbub p{flex:1;min-width:0;font-size:14.5px;line-height:1.55;color:var(--ink)}
.cbub p b{display:block;font:700 italic 12.5px/1.3 var(--h);letter-spacing:.04em;color:var(--c1);margin-bottom:1px}
.cbub>button{flex:0 0 auto;width:32px;height:32px;border-radius:10px;border:none;background:rgba(255,255,255,.06);color:var(--mut);font-size:13px}
.cbub.pr{border-color:rgba(255,209,92,.75);background:linear-gradient(120deg,rgba(255,209,92,.2),rgba(255,45,85,.08) 70%),#120709}
.cbub.pr::after{border-color:rgba(255,209,92,.75)}
.dots{display:inline-flex;gap:4px;align-items:center;height:18px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--c1);animation:dot 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,80%,100%{opacity:.25;transform:none}40%{opacity:1;transform:translateY(-3px)}}

/* coach chat sheet */
body.lock{overflow:hidden}
.csh{position:fixed;left:0;right:0;top:var(--vvt,0px);height:var(--vvh,100dvh);z-index:92;display:none;flex-direction:column;justify-content:flex-end;
  background:rgba(3,1,2,.64);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.csh.show{display:flex}
.cpan{position:relative;width:100%;max-width:600px;margin:0 auto;height:calc(100% - max(28px,env(safe-area-inset-top) + 12px));display:flex;flex-direction:column;
  background:radial-gradient(120% 50% at 50% 0%,rgba(255,45,85,.17),transparent 60%),#0c0507;border:1px solid rgba(255,45,85,.38);border-bottom:none;
  border-radius:24px 24px 0 0;overflow:hidden;animation:sheet .32s cubic-bezier(.2,.8,.3,1) both}
.chd{display:flex;align-items:center;gap:12px;padding:14px 14px 12px 16px;border-bottom:1px solid var(--ln)}
.chd .cav{width:46px;height:46px;flex:0 0 auto;border-radius:50%;background:#000 var(--face) center/cover;border:2px solid var(--c2);box-shadow:0 0 18px -4px rgba(255,45,85,.85)}
.chd .ct{flex:1;min-width:0}
.chd .ct b{display:block;font:700 italic 20px/1.15 var(--h);letter-spacing:.03em}
.chd .ct small{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--mut);margin-top:3px}
.chd .ct small i{width:8px;height:8px;flex:0 0 auto;border-radius:50%;background:var(--fnt)}
.chd .ct small i.on{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.chd .cx{width:42px;height:42px;flex:0 0 auto;border-radius:13px;border:1px solid var(--ln2);background:var(--p2);color:var(--mut);font-size:16px}
.clist{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:14px 14px 10px;display:flex;flex-direction:column;gap:10px}
.cm{max-width:86%;font-size:15px;line-height:1.6;padding:10px 13px;border-radius:16px;white-space:pre-wrap;overflow-wrap:anywhere}
.cm.c{align-self:flex-start;background:var(--p2);border:1px solid var(--ln2);border-left:3px solid var(--c2);border-radius:6px 16px 16px 16px}
.cm.u{align-self:flex-end;background:var(--grad);color:#fff;border-radius:16px 16px 6px 16px}
.cm.e{align-self:center;max-width:94%;font-size:12.5px;line-height:1.5;color:var(--fnt);padding:2px 8px;text-align:center}
.cm.err{align-self:flex-start;font-size:13.5px;color:#ffd9a0;background:rgba(255,181,71,.08);border:1px solid rgba(255,181,71,.32)}
.cempty{margin:auto 0;text-align:center;color:var(--mut);font-size:14.5px;line-height:1.7;padding:18px 12px}
.cempty .cav{width:88px;height:88px;margin:0 auto 12px;border-radius:50%;background:#000 var(--face) center/cover;border:2px solid var(--c2);box-shadow:0 0 34px -6px rgba(255,45,85,.95)}
.cempty b{display:block;font:700 italic 22px/1.3 var(--h);color:var(--ink);margin-bottom:4px}
.cmode{margin:0 14px 6px;padding:9px 12px;border-radius:12px;background:rgba(255,181,71,.07);border:1px solid rgba(255,181,71,.28);font-size:13px;line-height:1.5;color:#f6dcb2}
.cmode button{background:none;border:none;padding:0;color:var(--warn);font:600 13px var(--b);text-decoration:underline}
.cchips{display:flex;gap:7px;overflow-x:auto;padding:4px 14px 8px;scrollbar-width:none;flex:0 0 auto}
.cchips::-webkit-scrollbar{display:none}
.cchips button{flex:0 0 auto;height:36px;padding:0 13px;border-radius:999px;border:1px solid rgba(255,45,85,.42);background:rgba(255,45,85,.08);color:var(--ink);font:500 13.5px var(--b);white-space:nowrap}
.cchips button:active{transform:scale(.95)}
.cin{display:flex;gap:8px;align-items:flex-end;padding:8px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--ln);background:rgba(5,2,3,.65);flex:0 0 auto}
.cin textarea{flex:1;min-width:0;height:46px;max-height:132px;resize:none;background:var(--p2);border:1.5px solid var(--ln2);border-radius:16px;padding:11px 13px;font:400 16px/1.45 var(--b);color:var(--ink)}
.cin textarea:focus{outline:none;border-color:var(--c2)}
.cin textarea::placeholder{color:var(--fnt)}
.cin .snd{width:46px;height:46px;flex:0 0 auto;border-radius:50%;border:none;background:var(--grad);display:grid;place-items:center;box-shadow:0 8px 20px -8px rgba(255,45,85,.95)}
.cin .snd svg{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.cin .snd:disabled{opacity:.4}

/* coach settings */
.cfield{margin-top:13px}
.cfield label{display:block;font-size:13.5px;color:var(--mut);margin-bottom:6px}
.cfield input,.cfield textarea{width:100%;min-height:46px;background:var(--p2);border:1.5px solid var(--ln2);border-radius:13px;padding:10px 12px;font:500 16px var(--b);color:var(--ink)}
.cfield textarea{min-height:74px;font-weight:400;line-height:1.5;resize:vertical}
.cfield input:focus,.cfield textarea:focus{outline:none;border-color:var(--c2)}
.cfield .seg{grid-template-columns:repeat(var(--n,3),1fr)}
.krow{display:flex;gap:8px;margin-top:8px}
.krow button{flex:1;min-height:42px;border-radius:12px;border:1px solid var(--ln2);background:var(--p2);color:var(--ink);font:500 14px var(--b)}
.krow button.p{background:var(--grad);border:none;color:#fff;font-weight:600}
.cstat{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:999px;font:600 12.5px var(--b);white-space:nowrap}
.cstat.on{background:rgba(79,227,168,.1);color:#a9f3d6;border:1px solid rgba(79,227,168,.36)}
.cstat.off{background:var(--p2);color:var(--mut);border:1px solid var(--ln2)}

/* first run on the new address: bring data over */
.welc{height:150px;border-radius:18px;margin:2px 0 14px;background:var(--hero) center 24%/cover;border:1px solid rgba(255,45,85,.42);box-shadow:0 16px 40px -20px rgba(255,45,85,.9)}
.wsteps{list-style:none;counter-reset:w;display:flex;flex-direction:column;gap:9px;margin:4px 0 14px}
.wsteps li{counter-increment:w;position:relative;padding-left:34px;font-size:14.5px;line-height:1.55;color:var(--mut)}
.wsteps li b{color:var(--ink)}
.wsteps li::before{content:counter(w);position:absolute;left:0;top:0;width:24px;height:24px;border-radius:8px;display:grid;place-items:center;font:700 italic 14px var(--h);color:#fff;background:var(--grad)}

@media (max-width:370px){.hero.poster h2{font-size:36px}.hero.poster .in{max-width:72%}.nav .cbtn{flex-basis:64px}.cbtn .cav{width:52px;height:52px}}
@media (prefers-reduced-motion:reduce){.srise path{stroke-dashoffset:0}.sword{opacity:1}.cbtn.live .cav{animation:none}}

/* ---------- Zone 2 (19 Nov) ---------- */
.z2c{position:relative;border-color:color-mix(in srgb,var(--ec) 30%,var(--ln))}
.z2c::before{content:'';position:absolute;left:0;top:18px;width:3px;height:26px;border-radius:0 3px 3px 0;background:var(--ec)}
.z2c h3{margin-bottom:9px}
.z2c h3 small{font:500 12.5px var(--b);color:var(--warn)}
.z2c .tags{margin-top:0}
.z2w{font:500 13px var(--b);color:var(--mut);white-space:nowrap}
.z2w b{font:700 15px var(--h);color:var(--c1)}
.z2wn{margin-top:10px;padding:10px 12px;border-radius:13px;background:rgba(255,181,71,.07);border:1px solid rgba(255,181,71,.3);font-size:13.5px;color:#f6dcb2;line-height:1.5}
.z2m{margin-top:12px}
.z2g{margin-top:12px}
.z2g .numin{width:100%}
.z2o{margin-top:10px;font-size:13.5px;line-height:1.65;color:var(--mut)}
.z2o:empty{display:none}
.z2o b{font:600 16px var(--h);color:var(--ink)}
.z2o .bad{color:var(--bad)}.z2o .okc{color:var(--ok)}.z2o .mu{color:var(--mut)}
.z2bar{margin-top:12px;height:8px}

</style>
</head>

function streakCount(){let s=0,ds=today();if(!DID[ds])ds=addD(ds,-1);
 for(let i=0;i<400;i++){if(DID[ds])s++;else if(dayOf(ds)&&!(RDY[ds]&&RDY[ds].ill>=1))break;ds=addD(ds,-1)}return s}

/* ========= Zone 2 aerobic base (19 Nov) =========
 plan: weeks 1–2 Wed 25–30 + Thu 20, weeks 3–4 Wed 35–40 + Thu 25–30, week 5+ add Sun 20–30
 tied to day ids (d4 Recovery = main, d5 Push B / d1 Push A = after lifting) so swaps follow the session */
const Z2P=[{w:'1–2',tot:50,tl:'50',t:{d4:[25,30],d5:[20,20]}},
 {w:'3–4',tot:65,tl:'65',t:{d4:[35,40],d5:[25,30]}},
 {w:'5+',tot:90,tl:'90–100',t:{d4:[40,45],d5:[30,30],d1:[20,30]}}];
const Z2M={run:'🏃 วิ่ง',bike:'🚴 ปั่น',walk:'🚶 เดิน'};
/* first week whose Wednesday falls after the illness ramp (sick day + 8) and after today */
function z2Start(){const li=lastIll(today());let b=addD(today(),1);if(li&&addD(li,8)>b)b=addD(li,8);
 let s=weekOf(b)[0];if(addD(s,3)<b)s=addD(s,7);return s}
function z2Def(){return{on:true,start:z2Start(),lo:140,hi:150}}
function z2C(){return(CFG&&CFG.z2)||{on:false}}
function z2Wk(ds){const z=z2C();if(!z.on||!z.start)return 0;return Math.floor((dnum(weekOf(ds)[0])-dnum(weekOf(z.start)[0]))/7)+1}
function z2Ph(ds){const w=z2Wk(ds);return w<1?null:Z2P[w<=2?0:(w<=4?1:2)]}
function z2Tgt(ds){const z=z2C(),d=dayOf(ds);if(!z.on||!d)return null;const ph=z2Ph(ds);
 if(!ph)return d.id==='d4'?{lo:30,hi:40,mode:'walk',role:'main',pre:1}:null;
 const r=ph.t[d.id];if(!r)return null;
 return{lo:r[0],hi:r[1],mode:'run',role:d.id==='d4'?'main':'after',opt:d.id==='d1'}}
function z2Rng(t){return t.lo===t.hi?String(t.lo):t.lo+'–'+t.hi}
function pace(s){s=Math.round(s);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function z2Calc(r){const m=num(r.min),k=num(r.km);if(!(m>0&&k>0))return null;
 return r.mode==='bike'?{v:Math.round(k/(m/60)*10)/10+' กม./ชม.'}:{ps:m*60/k,v:pace(m*60/k)+' /กม.'}}
function z2Sum(x){const c=z2Calc(x);return[(Z2M[x.mode]||Z2M.run)+' '+num(x.min)+' นาที',num(x.km)?num(x.km)+' กม.':'',c?c.v:'',num(x.hr)?'HR '+num(x.hr):'',num(x.cad)&&x.mode==='run'?num(x.cad)+' spm':''].filter(Boolean).join(', ')}
async function z2All(){const o=[];for(const k of await L('z2:')){const v=await G(k);if(v&&num(v.min)>0)o.push(Object.assign({},v,{date:k.slice(3)}))}
 o.sort((a,b)=>a.date<b.date?-1:1);return o}
function z2Min(all,dates){const s=new Set(dates);return Math.round(all.filter(x=>s.has(x.date)).reduce((a,x)=>a+num(x.min),0))}
function z2Verdict(r,z){const o=[],hr=num(r.hr),cad=num(r.cad),c=z2Calc(r);
 if(c)o.push((r.mode==='bike'?'ความเร็ว ':'เพซ ')+'<b>'+c.v+'</b>');
 if(hr>0){if(hr>z.hi+3)o.push('<span class="bad">HR เกินโซน '+(hr-z.hi)+' ครั้ง/นาที ครั้งหน้าช้าลงหรือสลับเดิน</span>');
  else if(hr<z.lo-5)o.push('<span class="mu">'+(r.mode==='walk'?'HR ต่ำกว่าโซน เหมาะกับวันฟื้นตัว':'HR ต่ำกว่าโซน เร่งขึ้นได้นิดหน่อย')+'</span>');
  else o.push('<span class="okc">✓ อยู่ใน Zone 2</span>')}
 if(r.mode==='run'&&cad>0&&cad<160)o.push('<span class="mu">cadence ต่ำ ลองก้าวสั้นลง เป้าราว 170</span>');
 return o.join('<br>')}

async function liftStatus(a){

 for(const d of DAYS)for(const ex of d.ex){
  if(seen.has(ex.id))continue;seen.add(ex.id);
  const vp=await G('var:'+ex.id);let vi=vp&&typeof vp.i==='number'?vp.i:0;if(vi>(ex.alts||[]).length)vi=0;
  const eid=vi?ex.id+'#'+vi:ex.id,o=optOf(ex,vi),u=o.unit||ex.unit||'kg';
  const h=await hist(eid);if(h.length<2)continue;
  const kd=x=>u!=='bw'&&x.w>0,useE=kd(h[h.length-1]),seq=[];
  for(let i=h.length-1;i>=0&&seq.length<3;i--){if(kd(h[i])!==useE)break;seq.unshift(h[i])}
  if(seq.length<2)continue;
  const sameN=seq.every(x=>x.reps.length===seq[0].reps.length);
  const pts=seq.map(x=>useE?x.ae:(sameN?x.tot:x.mx));
  const l=pts[pts.length-1],p=pts[pts.length-2],l3=pts.slice(-3);
  let ic,tip;
  if(l3.length===3&&Math.max(...l3)-Math.min(...l3)<=Math.max(.5,l*.01)){ic='flat';tip='ติดที่เดิม 3 ครั้ง ลองพักนานขึ้น หรือเปลี่ยนช่วงครั้งชั่วคราว'}
  else if(l>p*1.005){ic='up';tip='กำลังขึ้น'}

  else{ic='same';tip='ทรงตัว'}
  const ch=ic==='flat'?'ไม่ขยับ':(useE?((l>=p?'+':'')+Math.round((l/p-1)*1000)/10+'%'):(p+' → '+l));
  out.push({n:o.name,d,ic,tip,ch,sub:ic==='flat'?'3 ครั้งล่าสุด':(useE?'แรงเทียบครั้งก่อน':(sameN?'ครั้งรวม':'เซ็ตที่ดีที่สุด')),last:h[h.length-1].date})}
 if(!out.length)return;

function cAppend(m){const l=document.getElementById('clist');if(!l)return;const e=l.querySelector('.cempty');if(e)e.remove();
 const el=document.createElement('div');el.className='cm '+(m.r==='x'?'err':m.r);el.textContent=m.r==='e'?'⚡ '+m.t:m.t;l.appendChild(el);l.scrollTop=l.scrollHeight;return el}
function cRender(){const l=document.getElementById('clist');if(!l)return;cDay();l.innerHTML='';
 if(!CO.msgs.length){const n=(ccfg().name||'').trim();
  l.innerHTML='<div class="cempty"><span class="cav" aria-hidden="true"></span><b>พร้อมลุยกับ'+(n?esc(n):'คุณ')+'</b>ถามเรื่องน้ำหนัก ฟอร์มท่า หรือให้ปลุกใจระหว่างพักได้เลย<br>จบเซ็ต จบท่า หรือทำสถิติใหม่ โค้ชจะคอมเมนต์ให้เอง</div>';return}
 CO.msgs.forEach(cAppend)}
function cTyping(){const l=document.getElementById('clist');if(!l||!document.getElementById('csh').classList.contains('show'))return null;
 const e=l.querySelector('.cempty');if(e)e.remove();
 const el=document.createElement('div');el.className='cm c typing';el.innerHTML='<span class="dots"><i></i><i></i><i></i></span>';l.appendChild(el);l.scrollTop=l.scrollHeight;return el}
function cTypingSet(el,t){if(!el||!el.isConnected)return;el.textContent=t;const l=el.parentElement;if(l)l.scrollTop=l.scrollHeight}
function cBusy(b){const s=document.getElementById('csnd');if(s)s.disabled=b}
function cVV(on){const vv=window.visualViewport,R=document.documentElement;
 if(!vv)return;if(CO.vv){vv.removeEventListener('resize',CO.vv);vv.removeEventListener('scroll',CO.vv);CO.vv=null}
 if(!on){R.style.removeProperty('--vvh');R.style.removeProperty('--vvt');return}
 CO.vv=()=>{R.style.setProperty('--vvh',vv.height+'px');R.style.setProperty('--vvt',vv.offsetTop+'px');const l=document.getElementById('clist');if(l)l.scrollTop=l.scrollHeight};
 vv.addEventListener('resize',CO.vv);vv.addEventListener('scroll',CO.vv);CO.vv()}
function coachOpen(){const s=document.getElementById('csh'),C=ccfg(),ai=!!ckey(),md=cMod();
 document.getElementById('cbub').classList.remove('show');document.getElementById('cdot').classList.remove('on');
 s.innerHTML='<div class="cpan" role="dialog" aria-modal="true" aria-labelledby="cshT"><div class="chd"><span class="cav" aria-hidden="true"></span>'+
  '<div class="ct"><b id="cshT">โค้ช IRON</b><small><i class="'+(ai?'on':'')+'"></i>'+(ai?'Claude '+md[1]+' พร้อมคุย':'โหมดพื้นฐาน ตอบได้ทันที ไม่ต้องใช้เน็ต')+'</small></div>'+
  '<button class="cx" type="button" aria-label="ปิดแชทโค้ช">✕</button></div><div class="clist" id="clist" aria-live="polite"></div>'+
  (ai?'':'<div class="cmode">อยากให้คุยได้ทุกเรื่อง ใส่ Claude API key ที่ <button type="button" id="cgo">ตั้งค่า</button></div>')+
  '<div class="cchips">'+CCHIPS.map(x=>'<button type="button">'+x+'</button>').join('')+'</div>'+
  '<div class="cin"><textarea id="cta" rows="1" placeholder="พิมพ์คุยกับโค้ช" aria-label="ข้อความถึงโค้ช" enterkeyhint="send"></textarea>'+
  '<button class="snd" id="csnd" type="button" aria-label="ส่งข้อความ"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M5.5 11.5L12 5l6.5 6.5"/></svg></button></div></div>';
 s.classList.add('show');s.setAttribute('aria-hidden','false');document.body.classList.add('lock');cRender();cVV(true);cBusy(CO.busy);
 const ta=document.getElementById('cta'),send=()=>{const v=ta.value.trim();if(!v||CO.busy)return;ta.value='';ta.style.height='';cAsk(v)};
 s.querySelector('.cx').onclick=coachClose;s.onclick=e=>{if(e.target===s)coachClose()};
 s.querySelectorAll('.cchips button').forEach(b=>b.onclick=()=>{if(!CO.busy){buzz();cAsk(b.textContent)}});
 document.getElementById('csnd').onclick=send;
 ta.oninput=()=>{ta.style.height='auto';ta.style.height=Math.min(132,ta.scrollHeight)+'px'};
 ta.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();send()}};
 const g=document.getElementById('cgo');if(g)g.onclick=()=>{coachClose();view='set';document.querySelectorAll('.nav button[data-v]').forEach(x=>x.classList.toggle('on',x.dataset.v==='set'));
  render().then(()=>{const c=document.getElementById('cset');if(c)c.scrollIntoView({block:'start'})})}}
function coachClose(){const s=document.getElementById('csh');s.classList.remove('show');s.setAttribute('aria-hidden','true');s.innerHTML='';document.body.classList.remove('lock');cVV(false)}

/* ---------- settings ---------- */
async function coachSettings(a){const C=ccfg(),k=ckey(),used=await G('cuse:'+today())||0;
 const g=document.createElement('div');g.className='sect';g.id='cset';
 g.innerHTML='<h3>🤖 โค้ช AI <span class="cstat '+(k?'on':'off')+'">'+(k?'เชื่อม Claude แล้ว':'โหมดพื้นฐาน')+'</span></h3>'+
  '<div class="srow2"><div><div class="l">💬 ให้โค้ชคอมเมนต์ระหว่างฝึก</div><div class="s">ขึ้นเหนือปุ่มโค้ชเมื่อจบเซ็ต จบท่า หรือทำสถิติใหม่</div></div><button class="tog'+(C.on?' on':'')+'" id="ct1" aria-label="ให้โค้ชคอมเมนต์ระหว่างฝึก"><i></i></button></div>'+
  '<div class="cfield"><label>สไตล์โค้ช</label><div class="seg" id="csty">'+Object.keys(CSTY).map(s=>'<button type="button" data-s="'+s+'" class="'+(C.style===s?'on':'')+'">'+CSTY[s][0]+'</button>').join('')+'</div></div>'+
  '<div class="cfield"><label for="cnm">ให้โค้ชเรียกคุณว่า</label><input id="cnm" maxlength="24" autocomplete="off" placeholder="เช่น ชื่อเล่น" value="'+esc(C.name||'')+'"></div>'+
  '<div class="cfield"><label for="cab">เป้าหมายหรือข้อจำกัดที่โค้ชควรรู้</label><textarea id="cab" maxlength="400" placeholder="เช่น เน้นกล้ามโต วิ่ง Zone 2 วันพุธ ไหล่ขวาเคยเจ็บ">'+esc(C.about||'')+'</textarea></div>'+
  '<div class="cfield"><label for="ckey">Claude API key</label><input id="ckey" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="'+(k?'บันทึกแล้ว ลงท้าย '+esc(k.slice(-4)):'sk-ant-…')+'">'+
  '<div class="krow"><button type="button" class="p" id="cks">บันทึก key</button><button type="button" id="ckt"'+(k?'':' disabled')+'>ทดสอบ</button><button type="button" id="ckd"'+(k?'':' disabled')+'>ลบ key</button></div></div>'+
  '<div class="cfield"><label>โมเดล</label><div class="seg" id="cmod" style="--n:2">'+CMOD.map(m=>'<button type="button" data-m="'+m[0]+'" class="'+(C.model===m[0]?'on':'')+'">'+m[1]+'<br><small>'+m[2]+'</small></button>').join('')+'</div></div>'+
  '<div class="srow2"><div><div class="l">🧠 ให้ AI คอมเมนต์เมื่อจบท่า</div><div class="s">ใช้ key ทุกครั้งที่จบท่าและจบวัน ถ้าปิด จะใช้คอมเมนต์พื้นฐานแทน</div></div><button class="tog'+(C.auto?' on':'')+'" id="ct2" aria-label="ให้ AI คอมเมนต์เมื่อจบท่า"><i></i></button></div>'+
  '<div class="hint">ไม่มี key โค้ชก็ทำงานแบบพื้นฐานได้ ถ้าอยากให้คุยได้ทุกเรื่อง สร้าง key ที่ platform.claude.com แล้วเติมเครดิตก่อนใช้ key เก็บในเครื่องนี้เท่านั้น ไม่อยู่ในไฟล์สำรอง ข้อความที่คุยและข้อมูลการฝึกวันนั้นจะถูกส่งไปที่ Claude ตอนคุยเท่านั้น วันนี้เรียกโค้ช AI แล้ว '+used+' ครั้ง</div>'+
  '<button class="big g" style="margin-top:12px" id="cclr">ล้างแชทวันนี้</button>';
 a.appendChild(g);
 document.getElementById('ct1').onclick=async e=>{C.on=!C.on;e.currentTarget.classList.toggle('on',C.on);await SV('cfg',CFG)};
 document.getElementById('ct2').onclick=async e=>{C.auto=!C.auto;e.currentTarget.classList.toggle('on',C.auto);await SV('cfg',CFG)};
 g.querySelectorAll('#csty button').forEach(b=>b.onclick=async()=>{C.style=b.dataset.s;g.querySelectorAll('#csty button').forEach(x=>x.classList.toggle('on',x===b));await SV('cfg',CFG)});
 g.querySelectorAll('#cmod button').forEach(b=>b.onclick=async()=>{C.model=b.dataset.m;g.querySelectorAll('#cmod button').forEach(x=>x.classList.toggle('on',x===b));await SV('cfg',CFG)});
 document.getElementById('cnm').oninput=e=>{C.name=e.target.value.trim();S('cfg',CFG)};
 document.getElementById('cab').oninput=e=>{C.about=e.target.value.trim();S('cfg',CFG)};
 document.getElementById('cks').onclick=()=>{const v=document.getElementById('ckey').value.trim();
  if(!v){toast('วาง key ก่อน','w');return}if(!/^sk-/.test(v)){toast('key ต้องขึ้นต้นด้วย sk-ant-','w');return}
  setCkey(v);toast('บันทึก key แล้ว');render().then(()=>{const c=document.getElementById('cset');if(c)c.scrollIntoView({block:'start'})})};
 document.getElementById('ckt').onclick=async e=>{const b=e.currentTarget;b.disabled=true;b.textContent='กำลังทดสอบ';
  try{const r=await cFetch({model:C.model,max_tokens:32,messages:[{role:'user',content:'ตอบสั้น ๆ ว่า พร้อม'}],output_config:{effort:'low'}});
   if(!r.ok){let j=null;try{j=await r.json()}catch(x){}throw{status:r.status,msg:j&&j.error&&j.error.message||''}}
   toast('เชื่อม Claude ได้แล้ว','p')}catch(err){toast(cErrMsg(err),'w')}
  b.disabled=false;b.textContent='ทดสอบ'};
 document.getElementById('ckd').onclick=()=>{if(!confirm('ลบ API key ออกจากเครื่องนี้?'))return;setCkey('');toast('ลบ key แล้ว');render()};
 document.getElementById('cclr').onclick=async()=>{cDay();CO.msgs=[];await S('cchat:'+CO.day,[]);toast('ล้างแชทวันนี้แล้ว')}}

/* ---------- first run on a new address ---------- */
function welcome(){if(document.getElementById('mbg').classList.contains('show'))return;
 const sa=window.navigator.standalone||(window.matchMedia&&matchMedia('(display-mode: standalone)').matches),ios=/iPhone|iPad|iPod/i.test(navigator.userAgent);
 showM('<h3>ยินดีต้อนรับสู่ IRON</h3><div class="welc" aria-hidden="true"></div>'+
  (ios&&!sa?'<div class="upsub">ย้ายประวัติการฝึกจากแอปเดิมมาไว้ที่นี่</div><ol class="wsteps"><li>เปิดแอปเดิม ไปที่ <b>ตั้งค่า</b> กด <b>ส่งออก</b> แล้วเก็บไฟล์ไว้ใน Files</li><li>ที่หน้านี้ใน Safari แตะ <b>แชร์</b> แล้วเลือก <b>Add to Home Screen</b></li><li>เปิดแอปจากไอคอนใหม่ กด <b>นำเข้าไฟล์สำรอง</b> แล้วเลือก <b>แทนที่ทั้งหมด</b></li></ol><button class="big" id="wcOk">เข้าใจแล้ว</button>'
  :'<div class="upsub">ถ้าเคยใช้แอปที่ลิงก์เดิม ส่งออกไฟล์สำรองจากแอปเดิมก่อน แล้วนำเข้าที่นี่ เลือก <b>แทนที่ทั้งหมด</b> ประวัติการฝึกจะมาครบ</div><button class="big" id="wcI">⬆ นำเข้าไฟล์สำรอง</button><button class="big g" style="margin-top:8px" id="wcN">เริ่มใช้งานใหม่</button>'));
 const ok=document.getElementById('wcOk');if(ok)ok.onclick=hideM;
 const im=document.getElementById('wcI');if(im)im.onclick=()=>{hideM();document.getElementById('fi0').click()};
 const nw=document.getElementById('wcN');if(nw)nw.onclick=hideM}
async function boot(){
 CFG=await G('cfg');DAYS=await G('days');PROGV=+(await G('progv'))||0;
 if(!CFG||!DAYS||!DAYS.length){const fresh=!DAYS||!DAYS.length;CFG=Object.assign(seedCfg(),CFG||{});
  if(fresh){FRESH=1;DAYS=seedDays();PROGV=V_LATEST;CFG.z2=z2Def();await S('progv',PROGV);for(const f of ['p57','p58','p59','p60','p61','p62','p63'])await S(f,1)}
  await S('cfg',CFG);await S('days',DAYS)}
 OVR=await G('ovr')||{};DID=await G('did')||{};RDY=await G('rdy')||{};await patchCore();await patchLegs();await patchWed();await patchLean();await patchV7();await patchZ2();await patchColors()}
(async function(){
 setTimeout(hideSplash,4000);
 try{
  await boot();
  try{if(navigator.storage&&navigator.storage.persist)await navigator.storage.persist()}catch(e){}
  document.getElementById('dpick').value=curDate;
  await render();
 }catch(e){console.error(e);toast('เปิดแอปไม่สำเร็จ ลองรีเฟรช','w')}
 hideSplash();
 document.getElementById('fi0').onchange=doImport;
 coachInit();
 if(FRESH)setTimeout(welcome,1300);
 let rz=0;window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(sizeEcg,150)});
 await checkAch();
 setTimeout(maybeUpgrade,1100);
 setTimeout(hintInstall,2600);setTimeout(hintBackup,3800);
})();
</script>
